<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leo Treasurer</title>
  <meta name="description" content="Monthly treasurer report for the Leo Club executive committee.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#070304">
  <link rel="icon" href="assets/logo.webp" type="image/webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="coins" aria-hidden="true">
    <i style="--x:4%;--s:18px;--d:19s;--w:-2s"></i><i style="--x:12%;--s:12px;--d:24s;--w:-11s"></i>
    <i style="--x:21%;--s:22px;--d:17s;--w:-6s"></i><i style="--x:30%;--s:14px;--d:26s;--w:-15s"></i>
    <i style="--x:39%;--s:10px;--d:21s;--w:-3s"></i><i style="--x:47%;--s:20px;--d:23s;--w:-18s"></i>
    <i style="--x:56%;--s:13px;--d:18s;--w:-9s"></i><i style="--x:64%;--s:24px;--d:27s;--w:-21s"></i>
    <i style="--x:72%;--s:11px;--d:20s;--w:-5s"></i><i style="--x:80%;--s:17px;--d:25s;--w:-13s"></i>
    <i style="--x:88%;--s:21px;--d:19s;--w:-16s"></i><i style="--x:95%;--s:12px;--d:22s;--w:-8s"></i>
  </div>
  <div id="app">
    <div class="boot"><img src="assets/logo.webp" alt="Leo Treasurer"><div class="spinner"></div></div>
  </div>
  <dialog id="dialog"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript><p style="padding:24px;color:#f5ecdc">Leo Treasurer needs JavaScript enabled.</p></noscript>
</body>
</html>
